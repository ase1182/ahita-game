<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>また明日も会うきみへ</title>
  <meta name="description" content="森のおやつ会で、7日間だけ相手とおやつを分けます。相手は、昨日のあなたを覚えています。" />
  <meta property="og:title" content="また明日も会うきみへ" />
  <meta property="og:description" content="森のおやつ会で、7日間だけ相手とおやつを分けます。相手は、昨日のあなたを覚えています。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="" />
  <meta property="og:image" content="" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-phase="day-1">
  <main class="game" aria-live="polite">
    <h1>また明日も会うきみへ</h1>

    <section id="start-screen" class="card">
      <div class="mini-stage">
        <div class="mini-shadow">🐾</div>
        <div class="mini-snack">🍪</div>
      </div>
      <p>
        森の広場には、毎日おやつが置かれます。<br>
        7日間だけ、同じ相手と会います。<br>
        今日だけなら、ひとりじめは得かもしれません。
      </p>
      <button id="start-button" type="button">1日目をはじめる</button>
    </section>

    <section id="game-screen" class="card" hidden aria-label="ゲーム画面">
      <div class="day-row">
        <p id="day-label" class="day">1日目</p>
        <p id="day-note" class="day-note">まだ、相手の正体はわかりません。</p>
      </div>
      <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>

      <div class="footprint-wrap" aria-label="7日間の足あと">
        <div class="footprint-row" id="player-track" aria-label="あなたの足あと"></div>
        <div class="footprint-row" id="opponent-track" aria-label="相手の足あと"></div>
      </div>

      <div class="forest-stage" id="forest-stage">
        <div class="stage-overlay" aria-hidden="true"></div>
        <div class="trees" aria-hidden="true"></div>
        <div class="ground" aria-hidden="true"></div>
        <div class="grass" aria-hidden="true"></div>
        <div class="character-card player" id="player-card"><span class="animal">🙂</span><small>あなた</small></div>
        <div class="stump" id="snack-zone"><span id="snack-icon">🍪</span></div>
        <div class="character-card mystery" id="opponent-name">
          <img id="opponent-image" class="character-image" alt="正体のわからない相手" width="110" height="110" hidden>
          <span id="opponent-fallback" class="animal">⬛</span>
          <small>？？？</small>
        </div>
      </div>

      <p id="message" role="status" aria-live="polite">相手は、昨日のことを覚えています。</p>

      <div class="buttons">
        <button id="share-button" type="button">わける</button>
        <button id="take-button" type="button">ひとりじめ</button>
      </div>
    </section>

    <section id="result-screen" class="card" hidden aria-label="結果画面">
      <div id="ending-scene" class="ending-scene"><span class="left">🙂</span><span class="middle">🍪</span><span class="right">❓</span></div>
      <h2 id="result-title"></h2>
      <p id="result-text"></p>
      <h3 id="opponent-reveal"></h3>
      <div class="result-opponent-wrap">
        <img id="result-opponent-image" class="result-opponent-image" alt="" width="130" height="130" loading="lazy" hidden>
        <span id="result-opponent-fallback" class="result-opponent-fallback">❓</span>
      </div>
      <p id="opponent-text"></p>
      <p id="relationship-ending" class="sub-result"></p>
      <p id="snack-result" class="sub-result"></p>

      <details class="theory">
        <summary>この森のしくみ</summary>
        <p>
          このゲームは、ゲーム理論で知られる「囚人のジレンマ」をもとにした小さな体験です。
          一度きりなら、ひとりじめは強い選択です。
          でも、同じ相手と何度も会うなら、「昨日のこと」が関係を変えます。
        </p>
      </details>

      <div class="buttons result-buttons">
        <button id="retry-button" type="button">もう一度、森へ行く</button>
        <button id="share-result-button" type="button">Xで共有</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
