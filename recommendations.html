<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>この森が好きな人へ</title>
  <meta name="description" content="「また明日も会うきみへ」の余韻に合う本や音声コンテンツの紹介ページです。" />
  <link rel="stylesheet" href="style.css?v=0.3.29" />
</head>
<body id="recommendations-page">
  <main class="recommendations-shell" aria-label="おすすめ紹介ページ">
    <p class="recommendations-pr-note">このページにはPR・広告リンクを含みます。</p>
    <h1>この森が好きな人へ</h1>
    <section class="recommendations-panel" aria-label="導入">
      <p>
        「また明日も会うきみへ」のように、選択、信頼、かけひき、静かな物語が好きな人へ。
        相性のよい本や音声コンテンツを少しずつ紹介します。
      </p>
    </section>

    <section class="recommendations-panel recommendations-card" aria-label="Audible紹介">
      <p class="recommendations-badge" aria-label="広告表記">PR</p>
      <h2>物語を耳で楽しみたい人へ</h2>
      <p>
        本を読む時間が取りにくいときでも、音声なら物語や本に触れやすくなります。
        寝る前、移動中、画面を見たくない時間に向いています。
      </p>
      <p class="recommendations-link-note">外部サイトへ移動します（PR）</p>
      <a class="recommendations-ad-link button-link" href="https://px.a8.net/svt/ejp?a8mat=4B3YV6+CY6FG2+5TB0+5YRHE" rel="nofollow noopener">AmazonのオーディオブックAudibleを見る</a>

<img border="0" width="1" height="1" src="https://www14.a8.net/0.gif?a8mat=4B3YV6+CY6FG2+5TB0+5YRHE" alt="">
    </section>

    <p class="recommendations-back-wrap">
      <a class="recommendations-back-link button-link" href="index.html?return=result">結果に戻る</a>
    </p>
  </main>
  <script>
    (function () {
      const KEY_FROM = "ahita.recommendations.fromResult";
      const KEY_BGM = "ahita.sound.enabled";
      const KEY_BGM_WAS_PLAYING = "ahita.recommendations.bgmWasPlaying";
      const KEY_BGM_TIME = "ahita.recommendations.bgmTime";
      const backLink = document.querySelector(".recommendations-back-link");
      const params = new URLSearchParams(window.location.search);
      const overlayMode = params.get("mode") === "overlay";
      const embeddedMode = overlayMode || params.get("embedded") === "1";
      if (embeddedMode) document.body.classList.add("is-embedded");
      if (!backLink) return;
      const fromResult = sessionStorage.getItem(KEY_FROM) === "true";
      if (fromResult) {
        if (overlayMode) {
          backLink.href = "#";
        }
        backLink.textContent = "結果に戻る";
        backLink.addEventListener("click", function (event) {
          event.preventDefault();
          if (overlayMode && window.parent && window.parent !== window) {
            window.parent.postMessage("ahita.closeRecommendationsOverlay", window.location.origin);
            return;
          }
          if (history.length > 1) {
            history.back();
            return;
          }
          window.location.href = "index.html";
        });
      } else {
        backLink.href = "index.html";
      }
      const soundEnabled = localStorage.getItem(KEY_BGM) !== "false";
      const wasPlaying = sessionStorage.getItem(KEY_BGM_WAS_PLAYING) === "true";
      if (!overlayMode && fromResult && soundEnabled && wasPlaying) {
        const bgm = new Audio("assets/forest-bgm.mp3");
        bgm.loop = true;
        bgm.volume = 0.25;
        const t = Number(sessionStorage.getItem(KEY_BGM_TIME) || 0);
        if (Number.isFinite(t) && t > 0) bgm.currentTime = t;
        const p = bgm.play();
        if (p && typeof p.catch === "function") p.catch(function(){ /* autoplay制限は許容 */ });
        window.addEventListener("pagehide", function () { bgm.pause(); });
      }
    }());
  </script>
</body>
</html>
